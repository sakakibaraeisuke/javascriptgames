<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Tetromino Tower - Matter</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
        }
    </style>
</head>

<body>

<script>

// =========================================================
// Phaser Configuration
// =========================================================

const config = {

    type: Phaser.AUTO,

    width: 800,
    height: 600,

    backgroundColor: '#222222',

    physics: {
        default: 'matter',
        matter: {
            gravity: {
                x: 0,
                y: 1
            },
        }
    },

    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);

// =========================================================
// Matter.js
// =========================================================
const Matter = Phaser.Physics.Matter.Matter;
const Body = Matter.Body;
const Bodies = Matter.Bodies;

//ブロックサイズの定義
const BLOCK_SIZE = 40;

// =========================================================
// テトロミノ形状
// =========================================================
const TETROMINO_SHAPES = {

    O: [
        [-20, -20],
        [ 20, -20],
        [-20,  20],
        [ 20,  20]
    ],

    T: [
        [-40, -10],
        [  0, -10],
        [ 40, -10],
        [  0,  30]
    ],

    S: [
        [  0, -20],
        [ 40, -20],
        [-40,  20],
        [  0,  20]
    ],

    Z: [
        [-40, -20],
        [  0, -20],
        [  0,  20],
        [ 40,  20]
    ],

    J: [
        [-30, -30],
        [-30,  10],
        [ 10,  10],
        [ 50,  10]
    ],

    L: [
        [ 30, -30],
        [-50,  10],
        [-10,  10],
        [ 30,  10]
    ],

    I: [
        [-60, 0],
        [-20, 0],
        [ 20, 0],
        [ 60, 0]
    ]
};


// =========================================================
// 現在操作中のテトロミノ
// =========================================================
let currentTetromino = null;

// =========================================================
// preload
// =========================================================
function preload() {
      this.load.audio('releaseSound', 'assets/Explosion01.mp3');
}


// =========================================================
// create
// =========================================================
function create() {

    // =====================================================
    // 地面
    // =====================================================
    const ground = this.add.rectangle(
        400,
        580,
        400,
        40,
        0x666666
    );
    this.matter.add.gameObject(ground,{isStatic: true});


    //-----------------------------
    // 効果音の導入
    // -------------------
    this.releaseSound = this.sound.add('releaseSound');

    // =====================================================
    // 最初のテトロミノを生成
    // =====================================================
    spawnControlledTetromino(this);

    // =====================================================
    // マウスクリック時の動作定義
    // =====================================================
    this.input.on('pointerdown', () => {

        if (!currentTetromino) {
            return;
        }

        // テトリミノを手放す
        currentTetromino.setStatic(false);
        currentTetromino = null;

        // 音を出す
        this.releaseSound.play();

        // 次のミノを生成
        spawnControlledTetromino(this);
    });

}


// =========================================================
// 操作可能なテトロミノを生成
// =========================================================
function spawnControlledTetromino(scene) {

    // =====================================================
    // 1000ミリ秒後に生成
    // =====================================================
    scene.time.delayedCall(1000, () => {

        // =====================================================
        // 生成位置
        // =====================================================
        const x = scene.input.activePointer.x;
        const y = 50; //マウスのy座標が大きくても上の方に留める。

        // =====================================================
        // ミノ生成
        // =====================================================
        const tetromino =
            createTetromino(
                scene,
                x,
                y
            );

        // =====================================================
        // 物理を一時停止
        // =====================================================
        Body.setStatic(tetromino.matterBody,true);

        // =====================================================
        // 現在操作中のミノとして保存
        // =====================================================
        currentTetromino = tetromino;
    });
}

// =========================================================
// テトロミノ生成
// =========================================================
function createTetromino(scene,x,y) {

    // =====================================================
    // ランダムなテトロミノを選択
    // =====================================================
    const shape =
        Phaser.Utils.Array.GetRandom(
            Object.values(TETROMINO_SHAPES)
        );

    // =====================================================
    // 色
    // =====================================================
    const color =
        Phaser.Display.Color.RandomRGB().color;

    // =====================================================
    // Phaser側のコンテナ
    // =====================================================
    const tetromino =
        scene.add.container(
            0,
            0
        );

    // =====================================================
    // Phaser側のブロック
    // =====================================================
    shape.forEach(
        ([dx, dy]) => {

            const block =
                scene.add.rectangle(
                    dx,
                    dy,
                    BLOCK_SIZE,
                    BLOCK_SIZE,
                    color
                );

            tetromino.add(
                block
            );

        }
    );

    // =====================================================
    // Matter Bodyのパーツ
    // =====================================================
    const parts = shape.map(
        ([dx, dy]) =>
            Bodies.rectangle(
                x + dx,
                y + dy,
                BLOCK_SIZE,
                BLOCK_SIZE
            )
    );

    // =====================================================
    // Compound Body
    // =====================================================
    const compoundBody =
    Body.create({
        parts: parts,
        restitution: 0.1,
        friction: 0.5
    });

    // =====================================================
    // 生成時にランダムな角度を決定
    // =====================================================
    Body.setAngle(
        compoundBody,
        Phaser.Math.FloatBetween(-Math.PI, Math.PI)
    );

    // Matter Worldへ追加
    scene.matter.world.add(
        compoundBody
    );

    // Phaser側に保存
    tetromino.matterBody = compoundBody;

    // 初期位置を同期
    syncTetromino(tetromino);
    return tetromino;
}

// =========================================================
// PhaserとMatterの同期
// =========================================================
function syncTetromino(tetromino) {
    const body =
        tetromino.matterBody;
    tetromino.x =
        body.position.x;
    tetromino.y =
        body.position.y;
    tetromino.rotation =
        body.angle;
}

// =========================================================
// update
// =========================================================
function update() {

    // =====================================================
    // 現在操作中のミノのアップデート
    // =====================================================
    if (currentTetromino) {
        const pointer = this.input.activePointer;
        const body = currentTetromino.matterBody;


        // =================================================
        // Matter Bodyをマウス位置へ移動
        // =================================================
        Body.setPosition(
            body,
            {
                x: pointer.x,
                y: 50
            }
        );
    }

    // =====================================================
    // すべてのテトロミノを同期
    // =====================================================

    this.children.list.forEach(
        (gameObject) => {
            if (!gameObject.matterBody) {
                return;
            }
            syncTetromino(
                gameObject
            );
        }
    );
}

</script>
</body>
</html>
