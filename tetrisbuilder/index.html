<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Tetromino Tower - Matter</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
        }
    </style>
</head>

<body>

<script>

// =========================================================
// 定数
// =========================================================
const BLOCK_SIZE = 40;
const SPAWN_DELAY = 1000;


// =========================================================
// Phaser Configuration
// =========================================================
const config = {

    type: Phaser.AUTO,

    width: 800,
    height: 600,

    backgroundColor: '#222222',

    physics: {
        default: 'matter',

        matter: {
            gravity: {
                x: 0,
                y: 1
            }
        }
    },

    scene: {
        preload,
        create,
        update
    }
};

const game = new Phaser.Game(config);


// =========================================================
// Matter.js
// =========================================================
const { Body, Bodies } =
    Phaser.Physics.Matter.Matter;


// =========================================================
// テトロミノ形状
// 重心がすべて (0, 0) になるように定義
// =========================================================
const TETROMINO_SHAPES = {

    O: [
        [-20, -20],
        [ 20, -20],
        [-20,  20],
        [ 20,  20]
    ],

    T: [
        [-40, -10],
        [  0, -10],
        [ 40, -10],
        [  0,  30]
    ],

    S: [
        [  0, -20],
        [ 40, -20],
        [-40,  20],
        [  0,  20]
    ],

    Z: [
        [-40, -20],
        [  0, -20],
        [  0,  20],
        [ 40,  20]
    ],

    J: [
        [-30, -30],
        [-30,  10],
        [ 10,  10],
        [ 50,  10]
    ],

    L: [
        [ 30, -30],
        [-50,  10],
        [-10,  10],
        [ 30,  10]
    ],

    I: [
        [-60, 0],
        [-20, 0],
        [ 20, 0],
        [ 60, 0]
    ]
};


// =========================================================
// 現在操作中のテトロミノ
// =========================================================
let currentTetromino = null;


// =========================================================
// preload
// =========================================================
function preload() {

    this.load.audio(
        'releaseSound',
        'assets/fallingsound.mp3'
    );
}


// =========================================================
// create
// =========================================================
function create() {

    // =====================================================
    // 地面
    // =====================================================
    const ground =
        this.add.rectangle(
            400,
            580,
            400,
            40,
            0x666666
        );

    this.matter.add.gameObject(
        ground,
        {
            isStatic: true
        }
    );


    // =====================================================
    // 効果音
    // =====================================================
    this.releaseSound =
        this.sound.add('releaseSound');


    // =====================================================
    // 最初のテトロミノ
    // =====================================================
    spawnControlledTetromino(this);


    // =====================================================
    // マウスクリック
    // =====================================================
    this.input.on('pointerdown', () => {

        if (!currentTetromino) {
            return;
        }

        // テトリミノを手放す
        currentTetromino.setStatic(false);
        currentTetromino = null;

        // 音を出す
        this.releaseSound.play();

        // 次のミノを生成
        spawnControlledTetromino(this);
    });
}


// =========================================================
// 操作可能なテトロミノを生成
// =========================================================
function spawnControlledTetromino(scene) {

    scene.time.delayedCall(
        SPAWN_DELAY,
        () => {
            const tetromino =
                createTetromino(
                    scene,
                    scene.input.activePointer.x,
                    50
                );
            tetromino.setStatic(true);
            currentTetromino = tetromino;
        }
    );
}


// =========================================================
// テトロミノ生成
// =========================================================
function createTetromino(scene, x, y) {

    // =====================================================
    // ランダムな形
    // =====================================================
    const shape =
        Phaser.Utils.Array.GetRandom(
            Object.values(TETROMINO_SHAPES)
        );

    // =====================================================
    // 色
    // =====================================================
    const color =
        Phaser.Display.Color.RandomRGB().color;

    // =====================================================
    // Phaser Container
    // =====================================================
    const tetromino =
        scene.add.container(
            x,
            y
        );


    // =====================================================
    // 表示用ブロック
    // =====================================================
    shape.forEach(
        ([dx, dy]) => {
            tetromino.add(
                scene.add.rectangle(
                    dx,
                    dy,
                    BLOCK_SIZE,
                    BLOCK_SIZE,
                    color
                )
            );
        }
    );


    // =====================================================
    // Compound Body の各パーツ
    // =====================================================
    const parts =
        shape.map(
            ([dx, dy]) =>
                Bodies.rectangle(
                    x + dx,
                    y + dy,
                    BLOCK_SIZE,
                    BLOCK_SIZE
                )
        );


    // =====================================================
    // 各パーツを合体させて一つのBodyを作る
    // =====================================================
    const compoundBody =
        Body.create({
            parts,
            restitution: 0.1,
            friction: 0.5
        });


    // =====================================================
    // ContainerにMatter Bodyを取り付ける
    // =====================================================
    scene.matter.add.gameObject(
        tetromino,
        compoundBody
    );


    // =====================================================
    // ランダムな角度
    // =====================================================
    tetromino.setRotation(
        Phaser.Math.FloatBetween(
            -Math.PI,
            Math.PI
        )
    );


    return tetromino;
}

// =========================================================
// update
// =========================================================
function update() {
    if (currentTetromino) {
        currentTetromino.setPosition(
            this.input.activePointer.x,
            50
        );
    }
}

</script>

</body>
</html>
